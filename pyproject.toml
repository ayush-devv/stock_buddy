[project]
name = "pi-portfolio"
version = "0.1.0"
description = "Private portfolio intelligence for NSE cash/delivery holdings (see docs/architecture.md)"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added per phase (docs/implementation-plan.md §11).
dependencies = [
    "duckdb>=2.0.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
pi = "pi.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]

# ---------------------------------------------------------------------------
# Import contracts (WP 0.2). They encode module rules from architecture §5 and
# §14.2. "decide must go through guard" is NOT expressible as an import rule;
# it is a runtime test in WP 4.2.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "pi"

[[tool.importlinter.contracts]]
name = "Layering: lower layers never import higher ones"
type = "layers"
layers = [
    "pi.cli",
    "pi.ui",
    "pi.alerts | pi.evaluate",
    "pi.decide",
    "pi.research",
    "pi.guard | pi.model",
    "pi.analytics | pi.ledger",
    "pi.ingest",
    "pi.refdata",
    "pi.store",
    "pi.config",
]

[[tool.importlinter.contracts]]
name = "Only pi.research may reach the lockbox loader (§14.2)"
type = "forbidden"
source_modules = [
    "pi.ui",
    "pi.alerts",
    "pi.evaluate",
    "pi.decide",
    "pi.guard",
    "pi.model",
    "pi.analytics",
    "pi.ledger",
    "pi.ingest",
    "pi.refdata",
    "pi.store",
    "pi.config",
]
forbidden_modules = ["pi.research.lockbox"]
