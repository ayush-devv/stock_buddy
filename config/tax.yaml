# Dated tax rules (architecture §12). Not tax advice; review with a CA once a year.
# confidence: verified | secondary | partly | unverified
# For each id, date ranges must not overlap. effective_to is inclusive; null means open-ended.
#
# Which date a rule is looked up on (pi.ledger.tax applies this):
#   stcg_rate, ltcg_rate      -> the sale date (rates changed mid-year on 23 Jul 2024)
#   ltcg_exemption_inr        -> the END of the financial year (31 Mar): it is one annual limit
#   cess_rate, stcg_87a_rebate -> the end of the financial year
#   buyback_regime            -> the public-announcement date if on/before 2019-07-05,
#                                otherwise the date the shares are bought back
# Assumption A9: total income under Rs 50 lakh, so no surcharge is modelled.
