# Decision and alert thresholds (architecture §11). Versioned by content hash.
decide:
  edge_shrinkage: 0.5            # expected edge = decile mean x 0.5 x position value
  min_sell_inr: 5000             # or the whole holding if smaller (ADR-0006)
  max_trims_per_quarter: 1       # replaces the infeasible 10% monthly turnover cap
  cooldown_days: 30              # per stock
  ltcg_defer_days: 60            # defer a sale when a lot turns long-term within this many days

guard:
  # Exchange surveillance (architecture §10.2). Stage details are partly unverified.
  gsm_block_buy_from_stage: 2    # brokers block buys from GSM stage 2
  gsm_weekly_from_stage: 3       # GSM stage 3 and up trades only in a weekly session
  window_results_buffer_hours: 48  # SEBI PIT: window reopens 48h after results

alerts:
  shadow_days: 20                # new yellow rules run silently for this many trading days
  urgent_weekly_cap: 3           # more than this triggers a threshold review
  drawdown_from_peak_pct: 15
  drawdown_vs_index_pct: 8
  vol_spike_ratio: 2.0           # 20d EWMA vol vs its 1-year median
  ltcg_window_days: 30
  ltcg_headroom_warn_pct: 80
  ca_exdate_days: 5
